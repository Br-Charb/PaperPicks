name: Main Branch Source Guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  require-dev-source:
    name: Require dev source
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.head_ref }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      TARGET_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify pull request source
        shell: bash
        run: |
          if [[ "$SOURCE_BRANCH" != "dev" || "$SOURCE_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
            echo "Pull requests into main must come from the dev branch in this repository."
            exit 1
          fi

          echo "Verified: this pull request merges dev into main."
